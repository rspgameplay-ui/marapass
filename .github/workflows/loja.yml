name: Builds de loja (Android AAB e iOS)

# Roda à mão em Actions > Builds de loja > Run workflow.
# Segredos necessários (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   keystore de upload em base64 (ver docs/ASSINATURA_ANDROID.md)
#   ANDROID_KEYSTORE_PASSWORD senha do keystore
#   ANDROID_KEY_ALIAS         alias da chave (padrão: upload)
#   ANDROID_KEY_PASSWORD      senha da chave
# Sem esses segredos, o AAB sai assinado com a chave de debug e NÃO serve para a Play.
# O iOS sai sem assinatura: a assinatura e o envio são feitos no Xcode/Transporter
# com a conta Apple Developer da empresa.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Site com as páginas legais
        default: https://marapass.com
        required: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Chave de upload
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Sem chave de upload: o AAB será assinado com a chave de debug."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties

      - name: Dependências
        run: flutter pub get

      - name: Compila o AAB
        run: >
          flutter build appbundle --release
          --dart-define-from-file=config/catalogo.json
          --dart-define=SITE_URL=${{ inputs.site_url }}

      - name: Apaga a chave do runner
        if: always()
        run: rm -f android/upload.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: marapass-android-aab
          path: flutter/build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Compila o iOS (sem assinatura)
        run: >
          flutter build ipa --release --no-codesign
          --dart-define-from-file=config/catalogo.json
          --dart-define=SITE_URL=${{ inputs.site_url }}

      - uses: actions/upload-artifact@v4
        with:
          name: marapass-ios-archive
          path: flutter/build/ios/archive
