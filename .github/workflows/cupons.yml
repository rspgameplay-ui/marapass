name: Cupons comerciais
on:
  pull_request:
    paths:
      - 'flutter/**'
      - 'supabase/**'
      - '.github/workflows/cupons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  banco-e-whatsapp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: marapass_coupon_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test supabase/tests/coupon_whatsapp.test.mjs
      - run: node --check flutter/admin/mvp-admin.js
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python supabase/tests/test_coupon_commerce.py
        env:
          MARA_TEST_DSN: postgresql://postgres@127.0.0.1:5432/marapass_coupon_test
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.8', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/mvp
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

