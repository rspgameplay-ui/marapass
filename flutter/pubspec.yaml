name: marapass_mapa
description: Mapa turístico Flutter do Maranhão, com dados próprios e exploração offline.
publish_to: none
version: 0.7.0+8
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  google_maps_flutter: 2.19.0
  google_maps_flutter_ios_sdk10: 2.19.0
  maplibre_gl: 0.27.1
  flutter_map: 8.3.2
  flutter_map_vector_tiles: 2.10.1
  latlong2: 0.10.1
  flutter_tts: 4.2.5
  speech_to_text: 7.5.0
  geolocator: 14.1.2
  url_launcher: 6.3.3
  shared_preferences: 2.5.6
  http: 1.6.0
  web: 1.1.1
  cupertino_icons: 1.0.8
  supabase_flutter: ^2.18.3
  qr_flutter: ^4.1.0
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/map/
    - assets/fonts/Manrope_OFL.txt

  fonts:
    - family: MaraSans
      fonts:
        - asset: assets/fonts/Manrope.ttf
        - asset: assets/fonts/Manrope.ttf
          weight: 700
