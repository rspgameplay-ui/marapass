<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Explore os 217 municípios do Maranhão, lugares reais e rotas dentro do MaraPass.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MaraPass">
  <meta name="theme-color" content="#0b3a66">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MaraPass</title>
  <link rel="manifest" href="manifest.json">
  <!-- MapLibre GL JS: motor do mapa 2D/3D na web (versão fixada). -->
  <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script defer src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
.maplibregl-ctrl-bottom-left { bottom: 190px !important; left: 8px !important; }
.maplibregl-ctrl-attrib { font-size: 10px !important; max-width: 260px; }
/* Mapa novo: o crédito é desenhado pelo app (o HTML ficaria por cima das folhas). */
.maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib { display: none !important; }
/* Tela de carregamento: aparece enquanto o app baixa, some no primeiro quadro. */
#mp-loading { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; background: #233347; color: #fff;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; transition: opacity .35s; }
#mp-loading b { font-size: 34px; font-weight: 800; letter-spacing: -.5px; }
#mp-loading span { font-size: 18px; opacity: .85; }
#mp-loading i { width: 46px; height: 46px; border-radius: 50%; border: 5px solid rgba(255,255,255,.25);
  border-top-color: #fac61d; animation: mp-spin 1s linear infinite; }
@keyframes mp-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="mp-loading" role="status" aria-live="polite">
    <i></i><b>MaraPass</b><span>Carregando, só um instante…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('mp-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="voice/recognition_adapter.js?v=3"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
